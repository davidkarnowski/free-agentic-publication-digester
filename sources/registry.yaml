  description: "The Supreme Court of the United States is the highest federal court; it does not publish through govinfo's USCOURTS collection. Its site posts slip opinions and order lists as PDFs on per-term HTML index pages, with opinions concentrated in the October-June term and each opinion led by an official syllabus."
  type: html-index
  tier: 1
  urls:
    index: https://www.supremecourt.gov/opinions/slipopinions.aspx
