# Living registry of federal publication sources (GUIDE.md §3).
# SOURCES.md is generated from this file by scripts/sources_doc.py — edit here,
# then regenerate. Schema is enforced by src/fapd/sources.py:
#   id (kebab, unique), name, branch, parent_org, description, type,
#   tier (int 1|2|3), urls, method, status, added, notes.
#
# Probe results (data/probe/2026-07-26/*.json) applied 2026-07-26: statuses,
# verified feed URLs, and probe findings recorded per entry.

# ---------------------------------------------------------------- active ----

- id: govinfo-crec
  name: Congressional Record (CREC)
  branch: legislative
  parent_org: U.S. Congress
  description: "The Congressional Record is the official verbatim record of congressional proceedings, published by the Government Publishing Office each day a chamber is in session. This collection carries the daily edition — House and Senate floor debate, Extensions of Remarks, and the Daily Digest — as structured XML (~2 MB of text on a typical session day) with PDF page images."
  type: govinfo-collection
  tier: 1
  urls:
    collection: https://www.govinfo.gov/app/collection/CREC
  method: govinfo collections API delta sync
  status: active
  added: "2026-07-26"
  notes: "Coverage (gate 3, backfilled 2026-07-30): the collection is itself the complete official record of the daily edition; delta sync lists every package and extraction reads every granule, so ingestion sees 100% of what GPO publishes here."

- id: govinfo-bills
  name: Congressional Bills (BILLS)
  branch: legislative
  parent_org: U.S. Congress
  description: "Congress publishes bill and resolution text through the Government Publishing Office at each printed stage (introduced, engrossed, enrolled, and others). This collection carries the full text as XML, with roughly 60-70 new or revised bill printings on a typical publication day (~28 KB of text each)."
  type: govinfo-collection
  tier: 1
  urls:
    collection: https://www.govinfo.gov/app/collection/BILLS
  method: govinfo collections API delta sync
  status: active
  added: "2026-07-26"
  notes: "Coverage (gate 3, backfilled 2026-07-30): the complete official bill-text record — every printed stage of every bill GPO publishes is listed by delta sync and extracted; nothing is sampled or filtered."

- id: govinfo-fr
  name: Federal Register (FR)
  branch: executive
  parent_org: National Archives and Records Administration
  description: "The Federal Register is the executive branch's daily journal, compiled by the Office of the Federal Register and published each business day. This collection carries final rules, proposed rules, notices, and presidential documents as structured XML (~2.6 MB of text per issue), with an agency-written abstract per document."
  type: govinfo-collection
  tier: 1
  urls:
    collection: https://www.govinfo.gov/app/collection/FR
  method: govinfo collections API delta sync
  status: active
  added: "2026-07-26"
  notes: "Coverage (gate 3, backfilled 2026-07-30): the complete daily issue — every document in each day's Federal Register is listed, extracted, and carries its official agency abstract; companion graphics PDFs are fetched for flagged documents under rule FR-GPH-01."

- id: govinfo-uscourts
  name: U.S. Courts Opinions (USCOURTS)
  branch: judicial
  parent_org: Federal judiciary
  description: "The federal judiciary provides opinions to the Government Publishing Office through a partnership with the Administrative Office of the U.S. Courts. This collection carries opinions from ~140 participating appellate, district, bankruptcy, and national courts as case-shaped packages, posted with a lag after filing; it is participation-based, not the complete federal judicial record."
  type: govinfo-collection
  tier: 1
  urls:
    collection: https://www.govinfo.gov/app/collection/USCOURTS
  method: govinfo collections API delta sync
  status: active
  added: "2026-07-26"
  notes: "Rule USCOURTS-FETCH-01: courts post opinions with delay, so each sync re-checks a trailing 7-day archive window rather than a single date. Participation-based (~140 courts), not the complete federal judicial record — every digest's judicial section carries the standing completeness disclosure (GUIDE §3)."

