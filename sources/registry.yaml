- id: justice-newsroom
  adapter: rss-feed-only
  name: Justice Press Releases
  branch: executive
  parent_org: Department of Justice
  description: "The Department of Justice enforces federal law and represents the United States in court. Its Office of Public Affairs channel carries national press releases — indictments, plea agreements, settlements, and policy announcements — typically many items per business day across litigating divisions."
  type: rss
  tier: 1
  urls:
    home: https://www.justice.gov/news
    feed: "https://www.justice.gov/feeds/justice-news.xml?type=All&component%5B436%5D=436&organization=All"
  method: Polls the Drupal views news feed (component parameter filters to Office of Public Affairs) via AgencyClient, feed metadata only.
  status: active
  added: "2026-07-26"
  notes: "Probed 2026-07-26: HTTP 404 at the old /feeds/opa/justice-news.xml path — a stale path, not a block. Re-probed 2026-07-28 at the corrected URL: feed verified — 25 items, ~250-char descriptions; the probe's single sample article extracted (3,117 chars). First full ingest 2026-07-28 revealed the catch: sustained article fetching (25 pages at the host's own 10s crawl-delay) is answered with Akamai bm-verify challenge interstitials (~2.5 KB, no content) — captured as evidence. Following the challenge URL would be bot-check circumvention, which we never do, so the posture is feed-only (adapter rss-feed-only): titles + descriptions, honestly disclosed per item. Content evaluation: DOJ publishes many items per business day; 25-item feed depth can under-cover heavy days — disclosed; division/USAO sibling feeds are the expansion path. A working DOJ feed also partially covers DEA and ATF (their enforcement news is republished here, DOJ-attributed). Activated 2026-07-28 (feed-only). Email sibling registered 2026-07-29: justice-email and usattorneys-email (GUIDE §3 email class; the web status here is unchanged)."

