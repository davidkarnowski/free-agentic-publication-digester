- id: usps-newsroom
  adapter: usps
  name: USPS Newsroom
  branch: executive
  parent_org: Independent establishment
  description: "The United States Postal Service is an independent establishment providing mail and package delivery. This autodiscovered RSS feed carries national news releases — stamp issuances, rates, service changes, and operations — as lede-paragraph descriptions with unusually deep history (668 items, ~270 characters each, no GUIDs); feed links route through a JavaScript redirect interstitial that carries no article text."
  type: rss
  tier: 2
  urls:
    home: https://about.usps.com/newsroom/national-releases/
    feed: https://about.usps.com/news/latestnews.rss
  method: RSS poll via AgencyClient, feed-metadata only (usps adapter; pending content evaluation)
  status: planned
  added: "2026-07-26"
  notes: "Probed 2026-07-26; captured bytes re-examined 2026-07-28: feed verified — 668 items, ~270-char lede-paragraph descriptions with datelines, no GUIDs. Every feed link routes through /newsroom/rssrequest.htm?nr=<article-path>, and the captured sample-article bytes are that 1.8 KB JavaScript redirect interstitial, not an article: it embeds NO content (no JSON-LD, no framework state blob; its entire visible text is 'RSS Feed Request' — the probe's 16-char extraction). The real article pages at /newsroom/<nr> were never fetched, so their extractability is unknown, not proven bad. The usps adapter therefore: (1) derives document identity by statically resolving nr= to the canonical article URL, normalized (lowercase host, query/fragment/trailing slash stripped) — dedupes URL variants despite the missing GUIDs; (2) ingests feed-metadata only (title + lede description, mode feed-only), never spending a request per item on the known-contentless interstitial. Can extract: titles, ~270-char ledes, claimed dates, canonical article URLs. Cannot extract: full article text — would require a deliberate re-probe of a resolved direct article URL (e.g. /newsroom/national-releases/2026/...htm) before any change to this posture."

