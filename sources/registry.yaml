# Living registry of federal publication sources (GUIDE.md §3).
# SOURCES.md is generated from this file by scripts/sources_doc.py — edit here,
# then regenerate. Schema is enforced by src/info_intel/sources.py:
#   id (kebab, unique), name, branch, parent_org, description, type, urls,
#   method, status, added, notes.

# ---------------------------------------------------------------- active ----

- id: govinfo-crec
  name: Congressional Record (CREC)
  branch: legislative
  parent_org: U.S. Congress
  description: "The daily edition of the Congressional Record: the official verbatim transcript of House and Senate floor proceedings and debate, plus Extensions of Remarks and the Daily Digest."
  type: govinfo-collection
  urls:
    collection: https://www.govinfo.gov/app/collection/CREC
  method: govinfo collections API delta sync
  status: active
  added: "2026-07-26"
  notes: ""

- id: govinfo-bills
  name: Congressional Bills (BILLS)
  branch: legislative
  parent_org: U.S. Congress
  description: "Full text of congressional bills and resolutions at each printed stage (introduced, engrossed, enrolled, and others)."
  type: govinfo-collection
  urls:
    collection: https://www.govinfo.gov/app/collection/BILLS
  method: govinfo collections API delta sync
  status: active
  added: "2026-07-26"
  notes: ""

- id: govinfo-fr
  name: Federal Register (FR)
  branch: executive
  parent_org: National Archives and Records Administration
  description: "The daily journal of the federal government: final rules, proposed rules, notices, and presidential documents, compiled by the Office of the Federal Register."
  type: govinfo-collection
  urls:
    collection: https://www.govinfo.gov/app/collection/FR
  method: govinfo collections API delta sync
  status: active
  added: "2026-07-26"
  notes: ""

- id: govinfo-uscourts
  name: U.S. Courts Opinions (USCOURTS)
  branch: judicial
  parent_org: Federal judiciary
  description: "Opinions from participating federal appellate, district, bankruptcy, and national courts, provided through a GPO partnership with the Administrative Office of the U.S. Courts."
  type: govinfo-collection
  urls:
    collection: https://www.govinfo.gov/app/collection/USCOURTS
  method: govinfo collections API delta sync
  status: active
  added: "2026-07-26"
  notes: "Rule USCOURTS-FETCH-01: courts post opinions with delay, so each sync re-checks a trailing 7-day archive window rather than a single date. Participation-based (~140 courts), not the complete federal judicial record — every digest's judicial section carries the standing completeness disclosure (GUIDE §3)."

