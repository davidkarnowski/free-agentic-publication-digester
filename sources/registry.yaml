- id: scotus-slip-opinions
  name: Supreme Court Slip Opinions
  branch: judicial
  parent_org: Supreme Court of the United States
  description: "Slip opinions and order lists published by the Supreme Court on its own site; the Court does not publish through the govinfo USCOURTS collection."
  type: html-index
  urls:
    index: https://www.supremecourt.gov/opinions/slipopinions.aspx
    home: https://www.supremecourt.gov/
  method: Would parse the current term's slip-opinion HTML index and fetch opinion PDFs, drafting syllabus-first (GUIDE §3 phase J2).
  status: planned
  added: "2026-07-26"
  notes: "First planned non-govinfo primary source, admitted deliberately per GUIDE §3. Slip-opinion index is per-term; the stable .aspx alias should resolve to the current term (verify at activation)."

