[project]
name = "fapd"
version = "0.1.0"
description = "Automated, cited, opinion-agnostic daily digest of official US government publications"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "David D. Karnowski" }]
requires-python = ">=3.12"
keywords = ["government", "digest", "govinfo", "civic-tech", "ai-agents", "provenance"]
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pypdf>=6.14.2",
    "pillow>=12.3.0",
    "markdown>=3.6",
    "pyyaml>=6.0.3",
    "protego>=0.6.2",
    "dkimpy>=1.1.8",
]

[project.urls]
Homepage = "https://github.com/davidkarnowski/free-agentic-publication-digester"
Repository = "https://github.com/davidkarnowski/free-agentic-publication-digester"
Issues = "https://github.com/davidkarnowski/free-agentic-publication-digester/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fapd"]

[tool.ruff]
line-length = 100
