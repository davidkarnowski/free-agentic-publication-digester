[project]
name = "info-intel"
version = "0.1.0"
description = "Automated, cited, opinion-agnostic daily digest of official US government publications"
authors = [{ name = "David D. Karnowski" }]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pypdf>=6.14.2",
    "pillow>=12.3.0",
    "markdown>=3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/info_intel"]

[tool.ruff]
line-length = 100
