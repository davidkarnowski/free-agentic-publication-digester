name: fapd

# FAPD stack on the shared VPS (/opt/fapd). Strict segmentation by design:
# - fapd_edge is an EXTERNAL, --internal Docker network (created once on the
#   box: `sudo docker network create --internal fapd_edge`). The only other
#   member is the shared edge proxy (spiralyst-proxy), which terminates TLS
#   for fapd.info and proxies here. --internal means no default route: this
#   container has ZERO egress, and nothing on the Spiralyst networks can
#   reach it except the proxy.
# - The backend (collector supervisor + EOD finalizer) arrives as a separate
#   service under `profiles: ["backend"]` on its own private egress-only
#   network, coupled to web ONLY through the fapd-site volume (never a
#   socket). See docs/continuous-ingestion.md and docs/vps-runtime-plan.md.

services:
  web:
    # Pinned to 1.30-alpine — parity with the edge proxy (the current nginx
    # STABLE branch). Bump both together during CVE sweeps, never just one.
    image: nginx:1.30-alpine
    container_name: fapd-web
    restart: unless-stopped
    expose: ["80"]                # private network only — never published
    networks: [fapd_edge]
    volumes:
      # The site hand-off: the backend writes /app/site into this volume;
      # web serves it read-only. A volume, never a socket — the two
      # containers share no network. Docker seeds an empty volume from the
      # backend image's baked site/ on first mount.
      - fapd-site:/usr/share/nginx/html:ro
    # Bounds + rotation (review D18/D19/R4): this is a shared VPS — a
    # runaway container must be contained, and an unrotated log must not
    # fill the disk. Values copied from the dev stack, where the block
    # ran first by design.
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    # Collector supervisor + in-supervisor EOD finalizer
    # (docs/continuous-ingestion.md §9). Egress-only: its own private
    # bridge, no published ports, NOT on fapd_edge — unreachable from the
    # proxy, the web container, or the public internet.
    build:
      context: .                  # the bundle dir; .dockerignore excludes
      dockerfile: Dockerfile.backend  # .env and secrets from the context
    image: fapd-backend:latest
    container_name: fapd-backend
    restart: unless-stopped
    profiles: ["backend"]
    command: ["--eod"]
    env_file: .env                # server-side only; never synced (deploy.sh excludes it)
    networks: [fapd_backend]
    volumes:
      - fapd-data:/app/data
      - fapd-site:/app/site
      # Evidence durability (F-021, 2026-08-07). /app is the image, not a
      # volume, so digests/, provenance/ and .git lived in the container's
      # writable layer: on 2026-08-07 an evidence commit sat unpushed all
      # day and any rebuild would have destroyed the digest, the manifest,
      # and an insight report no re-render could reproduce. With the files
      # durable a lost .git no longer matters — the next evidence-commit
      # re-stages the survivors and re-commits, so the fix self-heals.
      #
      # The cost, stated rather than discovered later: this is the F-009
      # class. Docker seeds a named volume from the image only when the
      # volume is EMPTY, so a rebuild never refreshes a populated one. A
      # RETIRED digest (as on 2026-08-03) will not leave the box by
      # deploying; it must be deleted from the volume explicitly, exactly
      # as the site volume already requires. Tracked as OB-19.
      #
      # SOURCES.md is an evidence path too but sits at the repo root, so it
      # stays ephemeral. That asymmetry is deliberate, not an oversight:
      # it regenerates deterministically from the registry via
      # scripts/sources_doc.py.
      - fapd-digests:/app/digests
      - fapd-provenance:/app/provenance
      - ./secrets:/app/secrets:ro # deploy key for evidence pushes (0600, root-owned dir)
    # Bounds + rotation (review D18/D19/R4), values from the dev stack's
    # tested block. The 1g ceiling is also D18's blast-radius limit: this
    # container parses network XML with the stdlib parser.
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    # Liveness = the supervisor's own heartbeat: some worker recorded a
    # cycle within 2h (the fastest worker cycles every ~10–20 min even
    # fully backed off, so 2h of silence means the loop is wedged — the
    # one state a process-alive check cannot see, because PID 1 dying
    # already exits the container). Base-image python; stdlib only.
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3, datetime as dt, sys; r = sqlite3.connect('file:/app/data/fapd.db?mode=ro', uri=True).execute('SELECT MAX(last_cycle_at) FROM collector_state').fetchone(); sys.exit(0 if r and r[0] and (dt.datetime.now(dt.UTC) - dt.datetime.fromisoformat(r[0].replace('Z', '+00:00'))).total_seconds() < 7200 else 1)"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m

networks:
  fapd_edge:
    external: true
  fapd_backend:
    driver: bridge                # egress-only by construction: no member
                                  # publishes ports; nothing else joins it

volumes:
  fapd-site:
  fapd-data:
  fapd-digests:
  fapd-provenance:
