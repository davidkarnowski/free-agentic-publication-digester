# fapd-web — the FAPD static site server. Repo-managed since the
# agent-discovery plan (docs/ops/plan-2026-09-13-agent-discovery.md,
# Phase 3 / task AD-11). Source of truth: deploy/vps/nginx/. Mounted
# read-only as the whole of /etc/nginx/conf.d/ in deploy/vps and
# deploy/dev (a DIRECTORY mount: rsync replaces files with new inodes,
# which a single-file bind mount never sees — 2026-07-30). Loaded inside
# the image's http{} block, so the map/limit_req_zone below are
# http-context. nginx includes only *.conf from this directory; the
# shared snippets are *.inc so they are not loaded twice.
#
# The edge proxy (cohabitant) terminates TLS and adds HSTS, nosniff,
# frame-options and referrer-policy: do not repeat them here — a
# duplicate reaches the client twice (pinned by tests/test_web_conf.py).
#
# Rehearse every change locally first: deploy/vps/nginx/rehearse.sh
# (throwaway container, the §3.5 request matrix). deploy.sh runs
# `nginx -t` against the candidate on the box BEFORE the swap, because
# a crash-looping fapd-web is also the edge proxy's static upstream.

# ---- Markdown content negotiation (master plan §8.2) -------------------
# Regex rows are tried in order of appearance, after the exact strings.
map $http_accept $fapd_wants_md {
    default                                        0;
    # SR-1: `text/markdown;q=0` is an explicit refusal, not a request.
    "~*(^|,)\s*text/markdown\s*(;\s*q=0(\.0+)?\s*(,|$))" 0;
    "~*(^|,)\s*text/markdown"                      1;
}

# Eligible HTML path -> its Markdown twin. Phase 2's build guarantees a
# twin exists for every path matched here (tests/test_markdown_twins.py
# coverage invariant), so a negotiated request never 404s. Named
# captures in a map regex become variables; the fapd_ prefix keeps them
# out of everyone else's namespace.
map $uri $fapd_twin {
    default                                              "";
    "/"                                                  "/index.md";
    "/index.html"                                        "/index.md";
    "~^/(today|50x)\.html$"                              "";
    "~^/(?<fapd_n>[A-Za-z0-9._-]+)\.html$"               "/${fapd_n}.md";
    "~^/sources/(?<fapd_s>[A-Za-z0-9._-]+)\.html$"       "/sources/${fapd_s}.md";
    "~^/archive/(?<fapd_y>[0-9]{4})\.html$"              "/archive/${fapd_y}.md";
}

map "$fapd_wants_md:$fapd_twin" $fapd_negotiated {
    default                  "";
    "~^1:(?<fapd_t>/.+)$"    $fapd_t;
}

# ---- Client identity and abuse limits for /mcp (used by Phase 4B) ------
# Only the edge proxy can reach fapd-web, and it sets X-Real-IP from the
# true remote address, so the header is trustworthy here. SR-4: an empty
# header (the dev stack, or a misconfiguration) must not silently disable
# the limits — fall back to the direct peer address.
map $http_x_real_ip $fapd_client {
    default   $http_x_real_ip;
    ""        $remote_addr;
}
limit_req_zone  $fapd_client zone=fapd_mcp:10m  rate=5r/s;
limit_conn_zone $fapd_client zone=fapd_conn:10m;

# ---- Phase 4B inserts the /mcp access-log format here -------------------
# (PHASE-4B-HTTP-INSERTION-POINT)

server {
    # Both listens are explicit: the image's entrypoint script
    # (10-listen-on-ipv6-by-default.sh) would add the IPv6 one by editing
    # default.conf in place, and this directory is mounted read-only —
    # it logs a harmless "can not modify" line and moves on.
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1k;          # no static path reads a body

    # text/html is always in charset_types; naming it again is a
    # "duplicate MIME type" warning from nginx -t (rehearsed 2026-09-13).
    # JSON types are deliberately absent: RFC 8259 defines no charset
    # parameter for application/json (and the +json types follow it), and
    # the master plan's §8.1 contract serves them bare (orchestrator,
    # 2026-09-13, on the Phase 3 exit report's question).
    charset utf-8;
    charset_types text/plain text/css text/xml text/markdown
                  application/atom+xml application/javascript;

    # The edge gzips html/json/plain/css/js/svg; these are the types it
    # does not. An already-encoded response is not re-compressed there.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/markdown application/linkset+json application/ai-catalog+json
               application/mcp-server-card+json application/atom+xml
               text/xml application/xml application/json text/plain;

    # Negotiate before location matching. The rewritten URI (*.md) maps to
    # no twin, so this can never loop. Server-level `if … rewrite … last`
    # is one of the two documented safe uses of `if`.
    if ($fapd_negotiated) {
        rewrite ^ $fapd_negotiated last;
    }

    location / {
        include /etc/nginx/conf.d/fapd-static-methods.inc;
        try_files $uri $uri/ =404;
    }

    # add_header in a location REPLACES every inherited add_header, so a
    # location that needs both snippets includes both explicitly. Nothing
    # relies on a server-level add_header.
    location ~ \.html$ {
        include /etc/nginx/conf.d/fapd-static-methods.inc;
        include /etc/nginx/conf.d/fapd-discovery-headers.inc;
    }

    location ~ \.md$ {
        include /etc/nginx/conf.d/fapd-static-methods.inc;
        default_type text/markdown;             # md is not in mime.types
        include /etc/nginx/conf.d/fapd-discovery-headers.inc;
        include /etc/nginx/conf.d/fapd-cors.inc;
    }

    location ~ \.(json|txt|xml)$ {
        include /etc/nginx/conf.d/fapd-static-methods.inc;
        include /etc/nginx/conf.d/fapd-cors.inc;
    }

    # Discovery documents with non-default media types (master plan §8.1).
    location = /.well-known/api-catalog {
        include /etc/nginx/conf.d/fapd-static-methods.inc;
        default_type application/linkset+json;  # no extension
        include /etc/nginx/conf.d/fapd-cors.inc;
    }
    location = /.well-known/ai-catalog.json {
        include /etc/nginx/conf.d/fapd-static-methods.inc;
        types { }                               # override .json -> application/json
        default_type application/ai-catalog+json;
        include /etc/nginx/conf.d/fapd-cors.inc;
    }
    location = /mcp/server-card {               # built in Phase 4C
        include /etc/nginx/conf.d/fapd-static-methods.inc;
        default_type application/mcp-server-card+json;
        include /etc/nginx/conf.d/fapd-cors.inc;
    }

    # Everything else under /.well-known/: real files are served; a probe
    # for a protocol we do not operate gets an honest 404 whose body
    # points to the real surfaces (plan §5 "declined"). `^~` stops regex
    # matching for the prefix, which is why the SKILL.md type is set by a
    # nested location rather than the `\.md$` regex above.
    location ^~ /.well-known/ {
        include /etc/nginx/conf.d/fapd-static-methods.inc;
        include /etc/nginx/conf.d/fapd-cors.inc;
        error_page 404 /_signpost/not-offered.json;
        location ~ \.md$ {
            include /etc/nginx/conf.d/fapd-static-methods.inc;
            default_type text/markdown;
            include /etc/nginx/conf.d/fapd-cors.inc;
        }
    }

    # Bodies for refusals; never directly reachable. The snippets say
    # `always`, so the 404 status keeps its CORS header.
    location ^~ /_signpost/ {
        internal;
        include /etc/nginx/conf.d/fapd-cors.inc;
        add_header Cache-Control "no-store" always;
    }

    # No other dotfile is ever served. Declared after the `^~` prefix
    # above: a `^~` match wins before any regex is considered, so
    # /.well-known/ never reaches this.
    location ~ /\.(?!well-known(/|$)) {
        return 404;
    }

    # ---- Phase 4B inserts `location = /mcp { … }` here ----------------
    # (PHASE-4B-SERVER-INSERTION-POINT)

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }
}
