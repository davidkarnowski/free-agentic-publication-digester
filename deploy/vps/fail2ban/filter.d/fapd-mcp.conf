# fail2ban filter for the FAPD MCP endpoint access log (nginx fapd_mcp
# format: "<client> - [time] "POST /mcp HTTP/1.1" <status> ...").
# Counts protocol/transport rejections. NOT counted: 404 (a modern MCP
# client probing an unimplemented method receives a legitimate
# 404/-32601) and 429 (a rate-limit hit is nginx doing its job; an eager
# but honest agent paging quickly, or many agents behind one cloud
# egress address, would otherwise collect twenty 429s in seconds and be
# banned for an hour — operator ruling 2026-09-14).
#
# The status group is followed by \s (not a literal trailing space): the
# ini parser strips trailing whitespace from values, and the whitespace
# is what keeps "4000" from matching "400".
[Definition]
failregex = ^<HOST> - \[[^\]]+\] "POST /mcp [^"]*" (400|403|405|413|415)\s
ignoreregex =
