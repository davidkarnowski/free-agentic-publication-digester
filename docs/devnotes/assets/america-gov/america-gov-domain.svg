<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440"
     role="img" aria-labelledby="agd-title agd-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="agd-title">america.gov domain record</title>
  <desc id="agd-desc">From the .gov WHOIS registry: registrant Department of State; created November 20, 2007; last updated September 23, 2026; registration expires May 20, 2027; registrar get.gov; status serverTransferProhibited; administered by the Cybersecurity and Infrastructure Security Agency; most contact fields redacted for privacy.</desc>
  <style>
    :root {
      --bg: #ffffff; --fg: #1b1f24; --muted: #57606a;
      --accent: #1f4e79; --accent-soft: #e8eff6; --border: #d8dde3; --on-accent: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151a20; --fg: #e6e9ec; --muted: #9aa4af;
        --accent: #7ab3e0; --accent-soft: #1a2733; --border: #2c343c; --on-accent: #0b1116;
      }
    }
    .card { fill: var(--bg); stroke: var(--border); }
    .rule { stroke: var(--border); }
    .stripe { fill: var(--accent-soft); }
    .brand { fill: var(--accent); font-size: 30px; font-weight: 700; }
    .kicker { fill: var(--on-accent); font-size: 12.5px; font-weight: 600; letter-spacing: .04em; }
    .label { fill: var(--muted); font-size: 13px; }
    .value { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .foot { fill: var(--muted); font-size: 11.5px; }
    .tld { fill: var(--accent); }
  </style>

  <!-- card -->
  <rect class="card" x="1" y="1" width="638" height="438" rx="14" stroke-width="1.5"/>

  <!-- header band -->
  <rect x="1.5" y="1.5" width="637" height="82" rx="13" fill="var(--accent)"/>
  <rect x="1.5" y="60" width="637" height="24" fill="var(--accent)"/>
  <text x="32" y="52" class="brand" fill="var(--on-accent)">america<tspan fill="var(--on-accent)">.gov</tspan></text>
  <text x="608" y="47" class="kicker" text-anchor="end">.GOV DOMAIN RECORD</text>

  <!-- rows -->
  <g>
    <!-- alternating stripes -->
    <rect class="stripe" x="1.5" y="108" width="637" height="42"/>
    <rect class="stripe" x="1.5" y="192" width="637" height="42"/>
    <rect class="stripe" x="1.5" y="276" width="637" height="42"/>
    <rect class="stripe" x="1.5" y="360" width="637" height="34"/>

    <text x="32" y="134" class="label">Registrant of record</text>
    <text x="608" y="134" class="value" text-anchor="end">Department of State</text>

    <text x="32" y="176" class="label">First registered</text>
    <text x="608" y="176" class="value" text-anchor="end">November 20, 2007</text>

    <text x="32" y="218" class="label">Record last updated</text>
    <text x="608" y="218" class="value" text-anchor="end">September 23, 2026</text>

    <text x="32" y="260" class="label">Registration expires</text>
    <text x="608" y="260" class="value" text-anchor="end">May 20, 2027</text>

    <text x="32" y="302" class="label">Registrar</text>
    <text x="608" y="302" class="value tld" text-anchor="end">get.gov</text>

    <text x="32" y="344" class="label">Status</text>
    <text x="608" y="344" class="value" text-anchor="end">serverTransferProhibited</text>

    <text x="32" y="384" class="label">TLD administered by</text>
    <text x="608" y="384" class="value" text-anchor="end">CISA</text>
  </g>

  <line class="rule" x1="1.5" y1="404" x2="638.5" y2="404" stroke-width="1"/>
  <text x="32" y="424" class="foot">Contact fields redacted for privacy · WHOIS via whois.nic.gov · retrieved 2026-09-29</text>
</svg>
